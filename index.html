<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aldeia Staff Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f5f5a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* Layout: phone-first single column, 680px reference width, sticky header with tabs, warm beige ledger palette */
:root{
  --bg:#e8e8e0; --surface:#fafaf8; --block:#c0c0b8; --line:#d5d5cd; --line-strong:#b0b0a8;
  --fg:#333; --muted:#6b6b63; --accent:#3f5f5a; --accent-fg:#ffffff; --accent-soft:#d9e3df;
  --ok:#2f7a46; --ok-bg:#dcebdc; --bad:#b23a2e; --bad-bg:#f3dcd8; --warn:#8a6414; --warn-bg:#f1e6c8; --off-bg:#e2e2da;
  --font:-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1d1a; --surface:#282824; --block:#3b3b35; --line:#35352f; --line-strong:#4b4b44;
  --fg:#e6e6de; --muted:#a2a298; --accent:#8fb8b0; --accent-fg:#10201d; --accent-soft:#2c3d39;
  --ok:#7cc893; --ok-bg:#1f3326; --bad:#ef8a7c; --bad-bg:#3d2420; --warn:#e0bd6a; --warn-bg:#3a3020; --off-bg:#2f2f2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1d1a; --surface:#282824; --block:#3b3b35; --line:#35352f; --line-strong:#4b4b44;
  --fg:#e6e6de; --muted:#a2a298; --accent:#8fb8b0; --accent-fg:#10201d; --accent-soft:#2c3d39;
  --ok:#7cc893; --ok-bg:#1f3326; --bad:#ef8a7c; --bad-bg:#3d2420; --warn:#e0bd6a; --warn-bg:#3a3020; --off-bg:#2f2f2a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line-strong)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.bt{font-weight:700;font-size:16px;letter-spacing:-.01em}
.bs{font-size:12px;color:var(--muted)}
.ver{font-variant-numeric:tabular-nums;background:var(--block);color:var(--fg);padding:1px 6px;border-radius:4px;font-size:11px}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.chipbtn{border:1px solid var(--line-strong);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line-strong);background:var(--bg);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;padding:0}
.iconbtn svg{width:16px;height:16px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px}
.tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab svg{width:12px;height:12px;opacity:.7}
main.wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
h2{font-size:18px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0;border:0;padding:0;margin:0}
.fld>span,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;min-height:38px}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{border:1px solid var(--line-strong);background:var(--bg);border-radius:7px;padding:8px 14px;min-height:38px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .wl{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.day{border:1px solid var(--line-strong);background:var(--bg);border-radius:7px;padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.day b{font-size:15px;font-variant-numeric:tabular-nums}
.day.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.day.today:not(.on){border-color:var(--accent);border-width:2px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.filters{grid-template-columns:1fr 1fr}}
details.flt>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.flt>summary::-webkit-details-marker{display:none}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--off-bg);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.missed{background:var(--bad-bg);color:var(--bad)}
.pill.due{background:var(--warn-bg);color:var(--warn)}
.pill.upcoming{background:var(--accent-soft);color:var(--accent)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 2px 0;border-bottom:1px solid var(--line-strong)}
.dayhead h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.item{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:8px;padding:12px}
.item.st-done{border-left-color:var(--ok)}
.item.st-missed{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad-bg) 45%,var(--surface))}
.item.st-due{border-left-color:var(--warn)}
.item.st-off{opacity:.7}
.tick input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--line-strong);border-radius:6px;background:var(--bg);display:grid;place-items:center;margin:0;cursor:pointer}
.tick input:checked{background:var(--ok);border-color:var(--ok)}
.tick input:checked::after{content:"";width:7px;height:13px;border:solid var(--surface);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ibody{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.itext{font-weight:600;overflow-wrap:anywhere}
.st-done .itext{text-decoration:line-through;text-decoration-color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.item textarea{min-height:36px;font-size:13px;padding:6px 8px}
.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.banner{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line-strong);background:var(--warn-bg);color:var(--fg)}
.banner b{color:var(--warn)}
.banner.info{background:var(--accent-soft)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.tablebox{max-width:680px;overflow-x:auto}
table.rep{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.rep th,table.rep td{padding:7px 9px;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
table.rep th:last-child,table.rep td:last-child{border-right:0}
table.rep th{background:var(--block);font-weight:600;border-color:var(--line-strong);border-top:1px solid var(--line-strong)}
table.rep tr.pre td,table.rep tr.tot td{background:var(--block);border-color:var(--line-strong)}
table.rep tr.tot td{font-weight:700}
table.rep .n{text-align:right}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:var(--ok)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.sec>summary{padding:13px 14px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-size:18px;color:var(--muted)}
details.sec[open]>summary::after{content:"–"}
details.sec>.secbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.count{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 11px;border-bottom:1px solid var(--line);background:var(--surface)}
.li:last-child{border-bottom:0}
.li .lt{min-width:0;overflow-wrap:anywhere}
.li .acts{display:flex;gap:4px;flex:none}
.wkdays{display:flex;gap:6px;flex-wrap:wrap}
.wkdays label,.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:7px;padding:6px 10px;background:var(--bg);cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.lock{align-items:center;text-align:center;padding:28px 18px}
.lock form{display:flex;gap:8px;width:100%;max-width:300px}
.subtle-sep{border:0;border-top:1px solid var(--line);margin:4px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;font-size:13px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.item{transition:background .2s,border-color .2s}}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
.prog{display:flex;flex-direction:column;gap:5px}
.bar.big{height:10px;border-radius:5px}
.cmt{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.addnew{display:flex;gap:6px;align-items:center}
.addnew input{flex:1}
.gate{max-width:420px;margin:24px auto 0;width:100%}
.gate form{display:flex;flex-direction:column;gap:10px}
.fbtext{font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.reply{border-left:3px solid var(--line-strong);padding:4px 10px;overflow-wrap:anywhere;white-space:pre-wrap}
.reply.mgr{border-left-color:var(--accent)}
.bad{color:var(--bad);font-weight:600}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:700}
.tl{display:flex;flex-direction:column;gap:8px}
.tlrow{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.tlrow .pill{flex:none}
.err{background:var(--bad-bg);border:1px solid var(--bad);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
table.rep td.l{text-align:left}
.tabbar{display:flex;align-items:stretch;gap:2px}
.tabbar .tabs{flex:1;min-width:0}
.tscroll{border:0;border-radius:6px;background:var(--accent-soft);color:var(--accent);width:30px;flex:none;font-size:20px;font-weight:700;line-height:1;padding:0;display:grid;place-items:center;margin-block:4px}
details.flt>summary{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:9px 12px;align-items:center;gap:8px}
details.flt>summary:hover{border-color:var(--accent)}
details.flt[open]>summary{margin-bottom:4px}
.fsum{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.chev{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:12px;flex:none}
@media (prefers-reduced-motion:no-preference){.chev{transition:transform .2s}}
details.flt[open]>summary .chev{transform:rotate(180deg)}
.ihead{display:flex;gap:8px;align-items:flex-start}
.ihead .itext{flex:1;min-width:0}
.who{flex:none;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:999px;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
button.dayhead{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;color:inherit;align-items:center}
button.dayhead[aria-expanded="true"]{border-color:var(--line-strong);background:var(--block)}
.dhl{display:flex;align-items:center;min-width:0;gap:8px}
.dh{font-size:14px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.pm{width:24px;height:24px;border:1px solid var(--line-strong);border-radius:6px;display:inline-grid;place-items:center;font-weight:700;background:var(--bg);flex:none;font-size:16px}
.brk{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px dashed var(--line-strong);border-radius:8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;gap:6px;align-items:center;border:1px solid var(--line-strong);border-radius:7px;padding:5px 9px;background:var(--bg);font-size:13px;cursor:pointer}
.weeknav{flex-wrap:wrap}
.btn.xs{padding:3px 10px;min-height:28px;font-size:12px;border-radius:6px}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;max-width:45%}
.rcol .who{max-width:100%}
.ttag{text-decoration:none;display:inline-block;vertical-align:1px;font-weight:400;margin-left:4px}
.ttwrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
.tt{display:grid;min-width:0}
.ttc{border-right:1px solid var(--line);min-width:0}
.ttc:last-child{border-right:0}
.tth{height:34px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--block);border-bottom:1px solid var(--line-strong)}
.tth.ttoday{background:var(--accent);color:var(--accent-fg)}
.ttany{padding:4px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line-strong);overflow:hidden}
.ttbody{position:relative;background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px)}
.ttime .ttbody{background:none}
.tthr{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tthr:first-child{transform:none}
.ev{position:absolute;border-radius:5px;padding:2px 5px;font-size:11px;line-height:1.25;overflow:hidden;border:1px solid var(--line-strong);background:var(--surface)}
.chip{border-radius:5px;padding:2px 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line-strong)}
.ev-task{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.ev-plan{background:var(--ok-bg);border-color:var(--ok);color:var(--fg)}
.ev-brk{background:var(--off-bg);border-style:dashed;color:var(--muted)}
.ev-test{background:var(--warn-bg);border-color:var(--warn);color:var(--fg)}
.evdone{opacity:.55;text-decoration:line-through}
.evmiss{border-color:var(--bad)}
.ev.clash,.lg.clash{box-shadow:inset 0 0 0 2px var(--bad)}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.lg{border:1px solid var(--line-strong);border-radius:5px;padding:1px 8px}
:root{--b0:#d6e6e2;--b0f:#2c5751;--b1:#f1e3c4;--b1f:#7a5612;--b2:#ead9e6;--b2f:#6a3460;--b3:#d8e2f0;--b3f:#2d4a72;--b4:#e2e6cf;--b4f:#4f5a1f;--b5:#f2dccf;--b5f:#7f3b1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b0:#22403b;--b0f:#9fd0c6;--b1:#3d3220;--b1f:#e6c47e;--b2:#3b2737;--b2f:#dfb0d4;--b3:#22304a;--b3f:#a9c4ea;--b4:#33381f;--b4f:#c9d38f;--b5:#43291e;--b5f:#efb091}}
:root[data-theme="dark"]{--b0:#22403b;--b0f:#9fd0c6;--b1:#3d3220;--b1f:#e6c47e;--b2:#3b2737;--b2f:#dfb0d4;--b3:#22304a;--b3f:#a9c4ea;--b4:#33381f;--b4f:#c9d38f;--b5:#43291e;--b5f:#efb091}
.who.bc0{background:var(--b0);color:var(--b0f)}.who.bc1{background:var(--b1);color:var(--b1f)}.who.bc2{background:var(--b2);color:var(--b2f)}
.who.bc3{background:var(--b3);color:var(--b3f)}.who.bc4{background:var(--b4);color:var(--b4f)}.who.bc5{background:var(--b5);color:var(--b5f)}
button.li.sr{width:100%;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;justify-content:flex-start;color:inherit;font:inherit}
button.li.sr:hover{background:var(--bg)}
button.li.sr .lt{flex:1}
.btn[disabled]{opacity:.5;cursor:not-allowed}
details.flt:not(.card)>summary{margin-top:4px}
details.flt:not(.card)[open]>.list{margin-top:6px}
.item{padding:8px 10px;gap:10px}
.ibody{gap:3px}
.tick input{width:22px;height:22px}
.tick input:checked::after{width:6px;height:11px}
.ihead{flex-wrap:wrap;align-items:center}
.rcol{flex-direction:row;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.rcol .pill,.rcol .who{font-size:11.5px;padding:1px 8px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px}
.iacts{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.btn.xs{min-height:24px;padding:2px 8px;font-size:12px}
.item .cmt{font-size:12.5px;padding:4px 8px}
button.dayhead.addhd{width:auto;border:0;background:none;padding:2px 0}
button.dayhead.addhd[aria-expanded="true"]{background:none}
.li .acts{flex-wrap:wrap;justify-content:flex-end}
.evx{cursor:pointer}
.ev.evx:hover,.chip.evx:hover{outline:2px solid var(--accent);outline-offset:-1px;z-index:2}
.tth{height:26px;font-size:12px}
.ttany{padding:3px;gap:2px}
.ttany0{padding:0;border-bottom:0}
.ev{font-size:10.5px;padding:1px 4px;line-height:1.2;border-radius:4px}
.chip{font-size:10.5px;padding:1px 5px}
.tthr{font-size:10px;right:4px}
.legend{font-size:11px}
.lg{padding:0 6px}
.pmx{display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font-weight:700;margin-right:4px;vertical-align:middle}
.pmx::before{content:"+"}
details[open]>summary .pmx::before{content:"−"}
.selbox{color:var(--muted)}

.mood{position:relative}.mood i{position:absolute;right:-3px;bottom:-3px;min-width:15px;height:15px;border-radius:8px;background:var(--surface);border:1px solid var(--line-strong);font-style:normal;font-size:10px;font-weight:800;color:var(--fg);display:grid;place-items:center}
.ms .mr{font-size:10px}
.phw{position:relative;display:inline-block}.phdel{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;border:0;background:#b23a2e;color:#fff;font-weight:800;font-size:13px;cursor:pointer;padding:0 6px}.phdel.on{font-size:11px}
.thumb .phbad{display:none}.thumb.bad .phbad{display:grid;place-items:center;width:64px;height:64px;font-size:10px;color:var(--muted);text-align:center;background:var(--off-bg);border-radius:8px}
.ihist summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;min-height:32px;display:flex;align-items:center}.ihist .li{padding:6px 8px}
.ibtabs.two{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:6px}
.bnav .bn span:not(.bnb){font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.moodstrip{gap:2px}.ms small{line-height:1.2;white-space:normal}.ms .mr{display:block;min-height:14px}
.hal-bday{background:#fdf1dc;border:1.5px solid #e0a43a;color:#4a3200;align-items:center}.hal-bday b{color:#7a4a00}.tico.bd{background:#d9822b}
</style>

function applies(r,date){

  if(r.archivedAt&&date>=r.archivedAt) return false;
  if(r.recur==='once') return r.date===date;
  if(!(r.days||[]).includes(parse(date).getDay())) return false;

}
const leaveOf=(sid,d)=>S.leave.find(l=>l.staffId===sid&&l.from<=d&&d<=(l.to||l.from));
function offReason(sid,date){
  const h=S.holidays.find(h=>h.date===date); if(h) return 'Holiday: '+(h.name||'');
  return S.leave.some(l=>l.staffId===sid&&l.from<=date&&date<=(l.to||l.from))?'On leave':'';
}

function status(r,date,sid,ign){

  const t=todayIso(); return date<t?'missed':date===t?'due':'upcoming';
}

function matchCommon(o,sid){
  const f=ui.f, st=byId('staff',sid);
  if(f.staff && sid!==f.staff && sid!=='*') return false;
  if(f.branch && sid!=='*' && (!st||st.branchId!==f.branch)) return false;
  if(f.child && o.childId!==f.child && !(o.childIds||[]).includes(f.child) && !o.wholeClass) return false;
  if(f.grade && o.gradeId!==f.grade && childGrade(o.childId)!==f.grade) return false;
  if(f.cur && o.curriculumId!==f.cur && !(f.child&&!o.curriculumId)) return false;

  return matchTime(o);
}

async function moodXL(cid){if(typeof XLSX==='undefined'){toast('Excel export could not load.');return}

  const rows=recs.map(m=>{const c=byId('children',m.childId)||{},mo=MOODS.find(k=>k[0]===m.mood)||[];return {Date:m.date,Day:DAYS_LONG[parse(m.date).getDay()],Child:c.name||'',Region:nm('branches',c.branchId),'Rating (1-5)':m.mood,Mood:(mo[2]||'').replace(/^\d · /,''),'Recorded by':whoName(m.by)}});

  await save(`Aldeia-moods-${cid?(byId('children',cid)||{}).name.replace(/\s+/g,'-'):'all'}-${todayIso()}.xlsx`,new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})))}

/* ---------- overview ---------- */
function stats(dates){
  const per={};
  liveStaff().forEach(s=>{if((!ui.f.branch||s.branchId===ui.f.branch)&&(ui.mgr||s.id===ui.me)&&(!ui.mgr||!ui.f.staff||s.id===ui.f.staff))per[s.id]={s,tot:0,done:0,missed:0,open:0,off:0,plans:0,pdone:0}});
  S.resp.forEach(r=>staffFor(r).forEach(sid=>{const p=per[sid];if(!p)return;dates.forEach(d=>{if(!applies(r,d)||(r.skip||[]).includes(d+'|'+sid))return;const st=status(r,d,sid);
    if(st==='off'){p.off++;return}p.tot++;if(st==='done')p.done++;else if(st==='missed')p.missed++;else p.open++})}));
  S.plans.forEach(pl=>{if(!dates.includes(pl.date))return;const tg=pl.staffId==='*'?Object.values(per):per[pl.staffId]?[per[pl.staffId]]:[];tg.forEach(p=>{p.plans++;if(pl.done)p.pdone++})});
  return Object.values(per).sort((a,b)=>staffLabel(a.s).localeCompare(staffLabel(b.s)));
}
function repTable(head,rows,total,numFrom=1){

    ${rows.map((r,i)=>tr(r,i===rows.length-1?'pre':'')).join('')}${total?tr(total,'tot'):''}</tbody></table></div>`;
}
const cellPct=(d,t)=>`${pct(d,t)}%<div class="bar"><i style="width:${pct(d,t)}%"></i></div>`;

/* ---------- records (children + coverage) ---------- */
function records({child,grade,since}){
  const recs=[];
  S.entries.forEach(e=>{const r=byId('resp',e.rid);if(!r||e.date<since)return;const sid=e.sid||r.staffId;
    if(!ui.mgr&&sid!==ui.me)return;
    if(child&&r.childId!==child)return; if(grade&&r.gradeId!==grade&&childGrade(r.childId)!==grade)return;
    if(!e.done&&!e.comment&&!(e.photos||[]).length)return;
    recs.push({date:e.date,kind:'Task',text:r.text,sid,done:!!e.done,comment:e.comment,photos:e.photos,o:r})});
  S.plans.forEach(p=>{if(p.date<since)return;if(!ui.mgr&&p.staffId!==ui.me&&p.staffId!=='*')return;
    if(child&&p.childId!==child)return; if(grade&&p.gradeId!==grade&&childGrade(p.childId)!==grade)return;
    recs.push({date:p.date,kind:'Plan',text:p.text,sid:p.staffId,done:!!p.done,photos:p.photos,o:p})});
  return recs.sort((a,b)=>b.date.localeCompare(a.date));
}
function covTable(recs,only){
  const rows=[];let P=0,T=0;
  sortByName('curriculum').filter(s=>!only||only.includes(s.id)).forEach(s=>{
    const tops=S.topics.filter(t=>t.subjectId===s.id).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    const line=(label,tf)=>{const rs=recs.filter(r=>r.o.curriculumId===s.id&&tf(r)),pl=rs.filter(r=>r.kind==='Plan').length,tk=rs.filter(r=>r.kind==='Task'&&r.done).length,last=rs.map(r=>r.date).sort().pop();
      P+=pl;T+=tk;rows.push([esc(s.name),esc(label),pl,tk,last?fmt(last):'<span class="bad">Not yet</span>'])};
    if(!tops.length) line('—',()=>true);
    else{tops.forEach(t=>line(t.name,r=>r.o.topicId===t.id));if(recs.some(r=>r.o.curriculumId===s.id&&!r.o.topicId))line('General',r=>!r.o.topicId)}
  });
  if(!rows.length) return `<div class="card empty">${only?'No curriculum linked to this child yet. Link it in Setup → Children.':'No curriculum yet. Add it in Planning or Setup.'}</div>`;

}

    return {Date:date,Day:DAYS[parse(date).getDay()],Time:timeLabel(r),Staff:staffLabel(sb),Branch:nm('branches',sb.branchId),Responsibility:r.text,Child:nm('children',r.childId),Grade:nm('grades',r.gradeId),
      Curriculum:nm('curriculum',r.curriculumId),Subject:tName(r.topicId),Status:st==='off'?offReason(sid,date):ST_LABEL[st],Comment:e.comment||'','Ticked by':e.done?nm('staff',e.by):'','Ticked at':e.done&&e.at?fmtAt(e.at):'',

async function save(filename,data){
  if(!dl){try{dl=await window.claude?.use?.('downloads')}catch(e){dl=null}}
  if(!dl){toast('Downloads are not available in this view.');return false}
  try{await dl.save({filename,data});return true}catch(e){if(e&&e.code!=='declined')toast('Could not save the file ('+(e.code||'error')+').');return false}
}
async function doExcel(){
  if(typeof XLSX==='undefined'){toast('Excel export could not load. Check your connection.');return}

  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sum.length?sum:[{Note:'No staff'}]),'Summary');
  await save(`Aldeia-staff-week-${isoWeek(ui.ws)}-${iso(ui.ws)}.xlsx`,new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})));

/* ---------- photos ---------- */
async function compress(file){
  try{const img=await createImageBitmap(file);const sc=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82))}catch(e){return file}
}
async function addPhoto(kind,key,file){
  if(!assets){toast('Photos are not available here.');return}
  toast('Uploading photo…');
  try{const res=await assets.upload(await compress(file)), ph={id:res.id,url:res.url,at:new Date().toISOString(),by:ui.mgr?'manager':ui.me};
    if(kind==='entry'){const [rid,date,sid]=key.split('|'),r=byId('resp',rid);if(!r)return;const id=ekey(r,date,sid);await setEntry(id,rid,date,sid,{photos:[...((entryMap[id]||{}).photos||[]),ph]})}
    else if(['leavereq','incidents','maint'].includes(kind)){const x=byId(kind,key);if(!x)return;const {id,...rest}=x;await put(kind,id,{...rest,photos:[...(x.photos||[]),ph],...(kind==='incidents'?{hist:[...(x.hist||[]),{at:ph.at,by:ph.by,what:'Photo added'}]}:{})})}
    else{const p=byId('plans',key);if(!p)return;const {id,...rest}=p;await put('plans',id,{...rest,photos:[...(p.photos||[]),ph]})}
    toast('Photo added')}catch(e){toast(e&&e.code==='not_granted'?'Photo uploads need edit access to this page.':'Photo upload failed. Try again with a smaller photo.')}
}

async function shrinkPhoto(blob){
  try{const img=await createImageBitmap(blob);let max=1000,q=.72,out='';
    for(let i=0;i<3;i++){const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<450000)break;max=Math.round(max*.75);q-=.08}
    return out}catch(e){return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)})}
}
