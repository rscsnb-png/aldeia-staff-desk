<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aldeia Staff Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-first single column, 680px reference width, sticky header with tabs, warm beige ledger palette */
:root{
  --bg:#e8e8e0; --surface:#fafaf8; --block:#c0c0b8; --line:#d5d5cd; --line-strong:#b0b0a8;
  --fg:#333; --muted:#6b6b63; --accent:#3f5f5a; --accent-fg:#ffffff; --accent-soft:#d9e3df;
  --ok:#2f7a46; --ok-bg:#dcebdc; --bad:#b23a2e; --bad-bg:#f3dcd8; --warn:#8a6414; --warn-bg:#f1e6c8; --off-bg:#e2e2da;
  --font:-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1d1a; --surface:#282824; --block:#3b3b35; --line:#35352f; --line-strong:#4b4b44;
  --fg:#e6e6de; --muted:#a2a298; --accent:#8fb8b0; --accent-fg:#10201d; --accent-soft:#2c3d39;
  --ok:#7cc893; --ok-bg:#1f3326; --bad:#ef8a7c; --bad-bg:#3d2420; --warn:#e0bd6a; --warn-bg:#3a3020; --off-bg:#2f2f2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1d1a; --surface:#282824; --block:#3b3b35; --line:#35352f; --line-strong:#4b4b44;
  --fg:#e6e6de; --muted:#a2a298; --accent:#8fb8b0; --accent-fg:#10201d; --accent-soft:#2c3d39;
  --ok:#7cc893; --ok-bg:#1f3326; --bad:#ef8a7c; --bad-bg:#3d2420; --warn:#e0bd6a; --warn-bg:#3a3020; --off-bg:#2f2f2a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line-strong)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.bt{font-weight:700;font-size:16px;letter-spacing:-.01em}
.bs{font-size:12px;color:var(--muted)}
.ver{font-variant-numeric:tabular-nums;background:var(--block);color:var(--fg);padding:1px 6px;border-radius:4px;font-size:11px}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.chipbtn{border:1px solid var(--line-strong);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line-strong);background:var(--bg);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;padding:0}
.iconbtn svg{width:16px;height:16px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px}
.tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab svg{width:12px;height:12px;opacity:.7}
main.wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
h2{font-size:18px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0;border:0;padding:0;margin:0}
.fld>span,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;min-height:38px}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{border:1px solid var(--line-strong);background:var(--bg);border-radius:7px;padding:8px 14px;min-height:38px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .wl{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.day{border:1px solid var(--line-strong);background:var(--bg);border-radius:7px;padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.day b{font-size:15px;font-variant-numeric:tabular-nums}
.day.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.day.today:not(.on){border-color:var(--accent);border-width:2px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.filters{grid-template-columns:1fr 1fr}}
details.flt>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.flt>summary::-webkit-details-marker{display:none}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--off-bg);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.missed{background:var(--bad-bg);color:var(--bad)}
.pill.due{background:var(--warn-bg);color:var(--warn)}
.pill.upcoming{background:var(--accent-soft);color:var(--accent)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 2px 0;border-bottom:1px solid var(--line-strong)}
.dayhead h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.item{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:8px;padding:12px}
.item.st-done{border-left-color:var(--ok)}
.item.st-missed{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad-bg) 45%,var(--surface))}
.item.st-due{border-left-color:var(--warn)}
.item.st-off{opacity:.7}
.tick input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--line-strong);border-radius:6px;background:var(--bg);display:grid;place-items:center;margin:0;cursor:pointer}
.tick input:checked{background:var(--ok);border-color:var(--ok)}
.tick input:checked::after{content:"";width:7px;height:13px;border:solid var(--surface);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ibody{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.itext{font-weight:600;overflow-wrap:anywhere}
.st-done .itext{text-decoration:line-through;text-decoration-color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.item textarea{min-height:36px;font-size:13px;padding:6px 8px}
.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.banner{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line-strong);background:var(--warn-bg);color:var(--fg)}
.banner b{color:var(--warn)}
.banner.info{background:var(--accent-soft)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.tablebox{max-width:680px;overflow-x:auto}
table.rep{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.rep th,table.rep td{padding:7px 9px;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
table.rep th:last-child,table.rep td:last-child{border-right:0}
table.rep th{background:var(--block);font-weight:600;border-color:var(--line-strong);border-top:1px solid var(--line-strong)}
table.rep tr.pre td,table.rep tr.tot td{background:var(--block);border-color:var(--line-strong)}
table.rep tr.tot td{font-weight:700}
table.rep .n{text-align:right}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:var(--ok)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.sec>summary{padding:13px 14px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-size:18px;color:var(--muted)}
details.sec[open]>summary::after{content:"–"}
details.sec>.secbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.count{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 11px;border-bottom:1px solid var(--line);background:var(--surface)}
.li:last-child{border-bottom:0}
.li .lt{min-width:0;overflow-wrap:anywhere}
.li .acts{display:flex;gap:4px;flex:none}
.wkdays{display:flex;gap:6px;flex-wrap:wrap}
.wkdays label,.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:7px;padding:6px 10px;background:var(--bg);cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.lock{align-items:center;text-align:center;padding:28px 18px}
.lock form{display:flex;gap:8px;width:100%;max-width:300px}
.subtle-sep{border:0;border-top:1px solid var(--line);margin:4px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;font-size:13px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.item{transition:background .2s,border-color .2s}}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
.prog{display:flex;flex-direction:column;gap:5px}
.bar.big{height:10px;border-radius:5px}
.cmt{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.addnew{display:flex;gap:6px;align-items:center}
.addnew input{flex:1}
.gate{max-width:420px;margin:24px auto 0;width:100%}
.gate form{display:flex;flex-direction:column;gap:10px}
.fbtext{font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.reply{border-left:3px solid var(--line-strong);padding:4px 10px;overflow-wrap:anywhere;white-space:pre-wrap}
.reply.mgr{border-left-color:var(--accent)}
.bad{color:var(--bad);font-weight:600}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:700}
.tl{display:flex;flex-direction:column;gap:8px}
.tlrow{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.tlrow .pill{flex:none}
.err{background:var(--bad-bg);border:1px solid var(--bad);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
table.rep td.l{text-align:left}
.tabbar{display:flex;align-items:stretch;gap:2px}
.tabbar .tabs{flex:1;min-width:0}
.tscroll{border:0;border-radius:6px;background:var(--accent-soft);color:var(--accent);width:30px;flex:none;font-size:20px;font-weight:700;line-height:1;padding:0;display:grid;place-items:center;margin-block:4px}
details.flt>summary{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:9px 12px;align-items:center;gap:8px}
details.flt>summary:hover{border-color:var(--accent)}
details.flt[open]>summary{margin-bottom:4px}
.fsum{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.chev{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:12px;flex:none}
@media (prefers-reduced-motion:no-preference){.chev{transition:transform .2s}}
details.flt[open]>summary .chev{transform:rotate(180deg)}
.ihead{display:flex;gap:8px;align-items:flex-start}
.ihead .itext{flex:1;min-width:0}
.who{flex:none;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:999px;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
button.dayhead{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;color:inherit;align-items:center}
button.dayhead[aria-expanded="true"]{border-color:var(--line-strong);background:var(--block)}
.dhl{display:flex;align-items:center;min-width:0;gap:8px}
.dh{font-size:14px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.pm{width:24px;height:24px;border:1px solid var(--line-strong);border-radius:6px;display:inline-grid;place-items:center;font-weight:700;background:var(--bg);flex:none;font-size:16px}
.brk{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px dashed var(--line-strong);border-radius:8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;gap:6px;align-items:center;border:1px solid var(--line-strong);border-radius:7px;padding:5px 9px;background:var(--bg);font-size:13px;cursor:pointer}
.weeknav{flex-wrap:wrap}
.btn.xs{padding:3px 10px;min-height:28px;font-size:12px;border-radius:6px}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;max-width:45%}
.rcol .who{max-width:100%}
.ttag{text-decoration:none;display:inline-block;vertical-align:1px;font-weight:400;margin-left:4px}
.ttwrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
.tt{display:grid;min-width:0}
.ttc{border-right:1px solid var(--line);min-width:0}
.ttc:last-child{border-right:0}
.tth{height:34px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--block);border-bottom:1px solid var(--line-strong)}
.tth.ttoday{background:var(--accent);color:var(--accent-fg)}
.ttany{padding:4px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line-strong);overflow:hidden}
.ttbody{position:relative;background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px)}
.ttime .ttbody{background:none}
.tthr{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tthr:first-child{transform:none}
.ev{position:absolute;border-radius:5px;padding:2px 5px;font-size:11px;line-height:1.25;overflow:hidden;border:1px solid var(--line-strong);background:var(--surface)}
.chip{border-radius:5px;padding:2px 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line-strong)}
.ev-task{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.ev-plan{background:var(--ok-bg);border-color:var(--ok);color:var(--fg)}
.ev-brk{background:var(--off-bg);border-style:dashed;color:var(--muted)}
.ev-test{background:var(--warn-bg);border-color:var(--warn);color:var(--fg)}
.evdone{opacity:.55;text-decoration:line-through}
.evmiss{border-color:var(--bad)}
.ev.clash,.lg.clash{box-shadow:inset 0 0 0 2px var(--bad)}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.lg{border:1px solid var(--line-strong);border-radius:5px;padding:1px 8px}
:root{--b0:#d6e6e2;--b0f:#2c5751;--b1:#f1e3c4;--b1f:#7a5612;--b2:#ead9e6;--b2f:#6a3460;--b3:#d8e2f0;--b3f:#2d4a72;--b4:#e2e6cf;--b4f:#4f5a1f;--b5:#f2dccf;--b5f:#7f3b1c}

.who.bc0{background:var(--b0);color:var(--b0f)}.who.bc1{background:var(--b1);color:var(--b1f)}.who.bc2{background:var(--b2);color:var(--b2f)}

button.li.sr{width:100%;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;justify-content:flex-start;color:inherit;font:inherit}

.yday{gap:8px}
button.thumb{padding:0;border:0;background:none;cursor:zoom-in;border-radius:6px}
#lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#lightbox[hidden]{display:none!important}
#lightbox img{max-width:100%;max-height:calc(100% - 60px);object-fit:contain;border-radius:6px;cursor:zoom-out}
.lbbar{display:flex;gap:8px;align-self:flex-end}
.logo{height:44px;width:auto;max-width:100%;background:#ffffff;border-radius:8px;padding:3px 6px;display:block;flex:0 1 auto;min-width:0;object-fit:contain}
@media (max-width:440px){.logo{height:36px}}
.brand .ver{align-self:flex-end;flex:none}
.subhd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 2px 0}
.src{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid var(--line-strong);text-transform:uppercase;letter-spacing:.04em}
.srcm{background:var(--warn-bg);color:var(--warn)}
.srcs{background:var(--bg);color:var(--muted)}
</style>

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font-size:14px;line-height:1.45}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.authcard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px}
.authcard .logo{height:56px;align-self:center}
.authcard form{display:flex;flex-direction:column;gap:10px}

.newhd{display:flex;align-items:center;gap:8px;padding:4px 2px}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:13px;align-self:flex-start;cursor:pointer}
</style>

const COLLS=['branches','staff','children','grades','curriculum','topics','periods','breaks','resp','tests','leave','holidays','entries','plans','signoffs','plocks','feedback','replies','log'];
const S={settings:{}}; COLLS.forEach(c=>S[c]=[]);
let entryMap={}, soMap={}, db=null, dl=null, assets=null, photoOk=false, loaded=false, dbState='loading';
const lsGet=k=>{try{return localStorage.getItem('asd_'+k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem('asd_'+k):localStorage.setItem('asd_'+k,v)}catch(e){}};

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=x.getDay();x.setDate(x.getDate()+(w===0?1:w===6?2:1-w));return x}
const todayIso=()=>iso(new Date());
const weekDates=ws=>[0,1,2,3,4].map(i=>iso(addDays(ws,i)));
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=s=>{if(!s)return'';const d=parse(s);return DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fmtAt=s=>{if(!s)return'';const d=new Date(s);return d.getDate()+' '+MON[d.getMonth()]+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dy=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-dy);const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil(((x-y0)/864e5+1)/7)}

const ui={tab:lsGet('tab')||'check',ws:mondayOf(new Date()),day:'all',f:{branch:'',staff:'',child:'',grade:'',cur:'',topic:'',period:''},
  me:lsGet('me')||'',mgr:lsGet('mgr')==='1',editing:{},acct:false,dismissed:false,confirmDel:null,open:new Set(),clear:new Set(),
  respStaff:'',openC:new Set(),kid:'',covSince:iso(addDays(new Date(),-56)),covGrade:'',covChild:'',importData:null,fltOpen:false,openDays:new Set(),testOpen:false,brkOpen:false,respBranch:'',focusDay:'',clash:null,clearOpen:false,copyOpen:false,q:'',showArch:false,nudgeHide:false,addOpen:false,evEdit:null,reassign:null,fbTo:'',fbSel:new Set(),ibStaff:'',ibDate:'',pgChild:'',clashOpen:false,ydayClosed:false};
if(ui.me) ui.f.staff=ui.me;

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=(c,id)=>id?S[c].find(x=>x.id===id):null;
const staffLabel=x=>x?((x.first||'')+' '+(x.last||'')).trim():'';
const periodLabel=x=>x?(x.name||'Period')+(x.start?` (${x.start}${x.end?'–'+x.end:''})`:''):'';
const labelFor=c=>c==='staff'?staffLabel:c==='periods'?periodLabel:c==='topics'?(x=>x?(x.name||'')+(x.subjectId?' · '+((S.curriculum.find(k=>k.id===x.subjectId)||{}).name||''):''):''):(x=>x?x.name||x.title||'':'');
const tName=id=>(byId('topics',id)||{}).name||'';
const nm=(c,id)=>c==='staff'&&id==='*'?'All staff':c==='staff'&&id==='manager'?'Manager':labelFor(c)(byId(c,id));
const periodsSorted=()=>[...S.periods].sort((a,b)=>(a.start||'').localeCompare(b.start||''));
const gKey=n=>{n=String(n||'');const m=n.match(/\d+/);if(m)return +m[0];const r=n.match(/\b(R{1,3})\b/i);return r?-r[1].length:999};
const sortByName=c=>[...S[c]].filter(x=>!x.archived).sort((a,b)=>c==='grades'?(gKey(a.name)-gKey(b.name)||(a.name||'').localeCompare(b.name||'')):labelFor(c)(a).localeCompare(labelFor(c)(b),undefined,{numeric:true}));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pct=(d,t)=>t?Math.round(d/t*100):0;
function opt(c,sel,ph,extra){const list=c==='periods'?periodsSorted():sortByName(c);const L=labelFor(c);
  return `<option value="">${esc(ph)}</option>`+(extra||[]).map(([v,l])=>`<option value="${v}"${v===sel?' selected':''}>${esc(l)}</option>`).join('')+list.map(x=>`<option value="${x.id}"${x.id===sel?' selected':''}>${esc(L(x))}</option>`).join('')}
function topicOpts(sid,sel,ph,add){const list=S.topics.filter(t=>!sid||t.subjectId===sid).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  return `<option value="">${esc(ph)}</option>`+list.map(t=>`<option value="${t.id}"${t.id===sel?' selected':''}>${esc(t.name)}${!sid&&t.subjectId?' · '+esc(nm('curriculum',t.subjectId)):''}</option>`).join('')+(add?'<option value="__new">+ Add new subject…</option>':'')}
const subjOpts=sel=>opt('curriculum',sel,'—')+'<option value="__new">+ Add new curriculum…</option>';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2800)}
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
const ico={moon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg>',
  sun:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/></svg>'};

/* ---------- time ---------- */
const TIMES=[];for(let m=420;m<=1020;m+=15)TIMES.push(pad(Math.floor(m/60))+':'+pad(m%60));
const timeOpts=(sel,ph,after)=>`<option value="">${ph}</option>`+TIMES.filter(t=>!after||t>after).map(t=>`<option${t===sel?' selected':''}>${t}</option>`).join('');
const SLOTS={am:{name:'Morning',start:'07:00',end:'12:00'},pm:{name:'Afternoon',start:'12:00',end:'17:00'}};
const sessOf=o=>o.session||o.periodId||'';
const oStart=o=>o.start||(byId('periods',o.periodId)||{}).start||'99';
const oEnd=o=>o.end||(byId('periods',o.periodId)||{}).end||'';
function timeLabel(o){const k=sessOf(o),n=SLOTS[k]?SLOTS[k].name:((byId('periods',k)||{}).name||''),st=oStart(o),e=oEnd(o);
  return [n,st!=='99'?st+(e?'–'+e:''):''].filter(Boolean).join(' ')}
function matchTime(o){const f=ui.f.period;if(!f)return true;const st=oStart(o);
  if(f==='am')return sessOf(o)==='am'||(st!=='99'&&st<'12:00');if(f==='pm')return sessOf(o)==='pm'||(st!=='99'&&st>='12:00');return sessOf(o)===f}
function timeBlock(p,o){const se=o?sessOf(o):'';
  return `<div class="grid3"><label class="fld"><span>Session</span><select id="${p}-sess" data-sess="${p}"><option value="">Any time</option><option value="am"${se==='am'?' selected':''}>Morning (07:00–12:00)</option><option value="pm"${se==='pm'?' selected':''}>Afternoon (12:00–17:00)</option>${periodsSorted().map(x=>`<option value="${x.id}"${x.id===se?' selected':''}>${esc(periodLabel(x))}</option>`).join('')}</select></label>
  <label class="fld"><span>From</span><select id="${p}-start">${timeOpts(o&&oStart(o)!=='99'?oStart(o):'','—')}</select></label>
  <label class="fld"><span>To</span><select id="${p}-end">${timeOpts(o?oEnd(o):'','—')}</select></label></div>`}
function readTime(p){const se=val(p+'-sess');return {session:se,periodId:SLOTS[se]?'':se,start:val(p+'-start'),end:val(p+'-end')}}
function subjTopic(p,o){const s=o?o.curriculumId||'':'',t=o?o.topicId||'':'';
  return `<div class="grid2"><label class="fld"><span>Curriculum</span><select id="${p}-cur" data-subj="${p}">${subjOpts(s)}</select></label>
  <label class="fld"><span>Subject</span><select id="${p}-topic" data-topic="${p}">${topicOpts(s,t,'—',true)}</select></label></div>
  <div class="addnew" id="xn-${p}-wrap" hidden><input type="text" id="xn-${p}" placeholder="New name"><button class="btn sm primary" type="button" data-act="addnew" data-p="${p}">Add</button><button class="btn sm" type="button" data-act="addcancel" data-p="${p}">Cancel</button></div>`}
const readSubj=p=>({curriculumId:val(p+'-cur').replace('__new',''),topicId:val(p+'-topic').replace('__new','')});
function pickBox(target,texts){const u=[...new Set(texts.filter(Boolean).map(t=>t.trim()))].sort((a,b)=>a.localeCompare(b));
  return `<label class="fld"><span>Choose from what's already there</span><select data-pick="${target}"><option value="">${u.length?'Choose existing…':'Nothing saved yet'}</option>${u.map(t=>`<option value="${esc(t)}">${esc(t.length>70?t.slice(0,70)+'…':t)}</option>`).join('')}</select></label>`}

/* ---------- logic ---------- */
const liveStaff=()=>S.staff.filter(x=>!x.archived);
const staffFor=r=>r.staffId==='*'?liveStaff().map(s=>s.id):[r.staffId];
const ekey=(r,date,sid)=>r.staffId==='*'?r.id+'_'+date+'_'+sid:r.id+'_'+date;
function applies(r,date){
  if((r.skip||[]).includes(date)) return false;
  if(r.archivedAt&&date>=r.archivedAt) return false;
  if(r.recur==='once') return r.date===date;
  if(!(r.days||[]).includes(parse(date).getDay())) return false;
  return !(r.from && date<r.from);
}
function offReason(sid,date){
  const h=S.holidays.find(h=>h.date===date); if(h) return 'Holiday: '+(h.name||'');
  return S.leave.some(l=>l.staffId===sid&&l.from<=date&&date<=(l.to||l.from))?'On leave':'';
}
const signed=(sid,date)=>!!soMap[sid+'_'+date];
function status(r,date,sid){
  const e=entryMap[ekey(r,date,sid)];
  if(e&&e.done) return 'done';
  if(offReason(sid,date)) return 'off';
  const t=todayIso(); return date<t?'missed':date===t?'due':'upcoming';
}
const ST_LABEL={done:'Done',missed:'Missed',due:'Due today',upcoming:'Upcoming',off:'Off'};
const childGrade=id=>(byId('children',id)||{}).gradeId||'';
function matchCommon(o,sid){
  const f=ui.f, st=byId('staff',sid);
  if(f.staff && sid!==f.staff && sid!=='*') return false;
  if(f.branch && sid!=='*' && (!st||st.branchId!==f.branch)) return false;
  if(f.child && o.childId!==f.child) return false;
  if(f.grade && o.gradeId!==f.grade && childGrade(o.childId)!==f.grade) return false;
  if(f.cur && o.curriculumId!==f.cur && !(f.child&&!o.curriculumId)) return false;
  if(f.topic && o.topicId!==f.topic) return false;
  return matchTime(o);
}
function itemsFor(dates){
  const out=[];
  dates.forEach(d=>S.resp.forEach(r=>{if(!applies(r,d))return;staffFor(r).forEach(sid=>{if((r.skip||[]).includes(d+'|'+sid))return;if(matchCommon(r,sid)) out.push({r,date:d,sid,st:status(r,d,sid)})})}));
  out.sort((a,b)=>a.date.localeCompare(b.date)||oStart(a.r).localeCompare(oStart(b.r))||nm('staff',a.sid).localeCompare(nm('staff',b.sid)));
  return out;
}
const plansFor=dates=>S.plans.filter(p=>dates.includes(p.date)&&matchCommon(p,p.staffId)).sort((a,b)=>a.date.localeCompare(b.date)||oStart(a).localeCompare(oStart(b)));
function testsFor(sid){
  const st=byId('staff',sid); if(!st) return [];
  const t=todayIso();
  return S.tests.filter(x=>{const who=x.staffId?x.staffId===sid:(!x.branchId||x.branchId===st.branchId);
    return who&&x.date&&x.date>=t&&daysBetween(t,x.date)<=(Number(x.lead)||3)}).sort((a,b)=>a.date.localeCompare(b.date));
}
function testsOnDate(date){
  const f=ui.f, fs=byId('staff',f.staff)||{};
  return S.tests.filter(x=>x.date===date&&(!f.branch||!x.branchId||x.branchId===f.branch)&&(!f.grade||!x.gradeId||x.gradeId===f.grade)&&(!f.cur||!x.curId||x.curId===f.cur)
    &&(!f.staff||(x.staffId?x.staffId===f.staff:(!x.branchId||fs.branchId===x.branchId))));
}
function tagsFor(o,sid,noTime){
  const t=noTime?[]:[timeLabel(o)];
  if(o.childId) t.push('Child: '+nm('children',o.childId));
  if(o.gradeId) t.push(nm('grades',o.gradeId));
  if(o.curriculumId) t.push(nm('curriculum',o.curriculumId));
  if(o.topicId) t.push(tName(o.topicId));
  return t.filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
}

/* ---------- writes ---------- */
async function put(c,id,data){if(!db){toast('Sign in to Claude to save changes.');return false}
  try{await db.collection(c).doc(id).set(data);return true}catch(e){toast(e&&e.code==='not_granted'?'You only have view access. Ask the owner for edit access.':'Could not save. Check your connection and try again.');return false}}
async function remove(c,id){if(!db)return;try{await db.collection(c).doc(id).delete()}catch(e){toast('Could not delete. Try again.')}}
function logAct(what){if(!db)return;db.collection('log').doc(newId()).set({at:new Date().toISOString(),who:ui.mgr&&!ui.me?'Manager':(nm('staff',ui.me)+(ui.mgr?' (admin)':'')),what}).catch(()=>{})}
async function setEntry(id,rid,date,sid,patch){
  const cur=entryMap[id]||{}, data={...cur,...patch,rid,date,sid};
  if('done' in patch){data.by=ui.me||'manager';data.at=new Date().toISOString()}
  delete data.id; entryMap[id]={...data,id}; render(); await put('entries',id,data);
  if('done' in patch) syncPlans(rid,date,sid,!!patch.done);
}
function syncPlans(rid,date,sid,done){const r=byId('resp',rid);if(!r)return;const key=(r.text||'').trim().toLowerCase();if(!key)return;
  S.plans.filter(p=>p.date===date&&(p.staffId===sid||p.staffId==='*')&&!!p.done!==done&&(p.text||'').trim().toLowerCase().startsWith(key))
   .forEach(p=>{const {id,...rest}=p;p.done=done;put('plans',id,{...rest,done,doneFromTask:true});checkPlanDone(p.staffId,p.date)})}

/* ---------- render core ---------- */
const panel=document.getElementById('panel');
function tabsFor(){return ui.mgr?[['check','Checklist'],['plan','Planning'],['resp','Responsibilities'],['time','Timetable'],['over','Overview'],['kids','Children'],['fb','Messages'],['inbox','Inbox'],['setup','Setup']]
  :[['check','Checklist'],['plan','Planning'],['time','Timetable'],['over','My progress'],['kids','Children'],['fb','Messages']]}
const signedIn=()=>!!(ui.me||ui.mgr);
function renderChrome(){
  const tabs=document.getElementById('tabs');
  if(!signedIn()){tabs.innerHTML='';tabs.hidden=true}else{tabs.hidden=false;const n=unread(),ni=unreadInbox();
    tabs.innerHTML=tabsFor().map(([k,l])=>`<button class="tab${ui.tab===k?' on':''}" role="tab" aria-selected="${ui.tab===k}" data-act="tab" data-t="${k}">${l}${k==='fb'&&n?` <span class="badge">${n}</span>`:''}${k==='inbox'&&ni?` <span class="badge">${ni}</span>`:''}</button>`).join('')}
  const me=byId('staff',ui.me);
  document.getElementById('whoBtn').textContent=me?staffLabel(me):(ui.mgr?'Manager':'Sign in');
  document.getElementById('themeBtn').innerHTML=effTheme()==='dark'?ico.sun:ico.moon;
  syncTabs(true);
}
function syncTabs(ensure){const t=document.getElementById('tabs'),l=document.getElementById('tl'),r=document.getElementById('tr');if(!t||!l)return;
  if(t.hidden){l.hidden=r.hidden=true;return}
  if(ensure){const on=t.querySelector('.on');if(on){const a=on.offsetLeft-t.offsetLeft,b=a+on.offsetWidth;if(a<t.scrollLeft)t.scrollLeft=Math.max(0,a-30);else if(b>t.scrollLeft+t.clientWidth)t.scrollLeft=b-t.clientWidth+30}}
  l.hidden=t.scrollLeft<=2;r.hidden=t.scrollLeft+t.clientWidth>=t.scrollWidth-2}
function dayHead(k,label,right,bad){const o=ui.openDays.has(k);
  return `<button class="dayhead" data-act="dtog" data-k="${k}" aria-expanded="${o}"><span class="dhl"><span class="pm">${o?'−':'+'}</span><span class="dh"${bad?' style="color:var(--bad)"':''}>${esc(label)}</span></span><span class="muted small">${right}</span></button>`}
function allBtn(p,ds){const all=ds.every(d=>ui.openDays.has(p+d));return `<button class="btn sm" data-act="dall" data-p="${p}" data-o="${all?0:1}">${all?'− Close all days':'+ Open all days'}</button>`}
let pending=false;
const isEditing=()=>{const a=document.activeElement;return a&&panel.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!['checkbox','radio','file'].includes(a.type)};
function scheduleRender(){if(isEditing()){pending=true;return}render()}
document.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(!isEditing()){pending=false;render()}},60)});
const VIEWS={inbox:vInbox,search:vSearch,time:vTime,check:vCheck,plan:vPlan,over:vOver,kids:vKids,cover:vCover,fb:vFb,resp:vResp,setup:vSetup};
function render(){
  pending=false;
  try{
    const saved={};
    panel.querySelectorAll('[id^="sf-"],[id^="rf-"],[id^="pf-"],[id^="fb-"],[id^="tf-"]').forEach(el=>{saved[el.id]=(el.type==='checkbox'||el.type==='radio')?el.checked:el.value});
    if(loaded&&ui.me&&S.staff.length&&(!byId('staff',ui.me)||byId('staff',ui.me).archived)){ui.me='';lsSet('me',null)}
    if(!ui.mgr) ui.f.staff=ui.me;
    if(ui.tab!=='search'&&!tabsFor().some(t=>t[0]===ui.tab)) ui.tab='check';
    let h='';
    if(dbState==='none') h+=`<div class="banner info"><b>Sign in to Claude to use the shared tracker.</b><span>Ticks, comments and planning are saved in one shared place once you're signed in.</span></div>`;
    else if(dbState==='error') h+=`<div class="banner"><b>Couldn't reach the shared data.</b><span>Check your connection, then reopen this page.</span></div>`;
    if(!signedIn()) h+=vGate(); else {if(ui.acct)h+=acctCard(); h+=VIEWS[ui.tab]();}
    panel.innerHTML=h;
    for(const id in saved){if([...ui.clear].some(p=>id.startsWith(p)))continue;const el=document.getElementById(id);if(!el)continue;
      if(el.type==='checkbox'||el.type==='radio')el.checked=saved[id];else el.value=saved[id]}
    panel.querySelectorAll('select[data-subj]').forEach(sel=>{const p=sel.dataset.subj,tp=document.getElementById(p+'-topic');if(!tp)return;
      const keep=tp.value;tp.innerHTML=topicOpts(sel.value.replace('__new',''),keep,'—',true);tp.value=keep;if(tp.value!==keep)tp.value=''});
    ['pf','rf','tf'].forEach(p=>linkChild(p,false));
    panel.querySelectorAll('select[id$="start"]').forEach(syncEnd);
    ui.clear.clear(); syncRecur();
    if(ui.tab==='fb'&&signedIn()&&loaded&&unread())lsSet(seenKey('fb'),new Date().toISOString());
    if(ui.tab==='inbox'&&signedIn()&&loaded&&unreadInbox())lsSet(seenKey('inbox'),new Date().toISOString());
    renderChrome();
  }catch(e){
    console.error(e);
    panel.innerHTML=`<div class="err"><b>Something went wrong showing this page.</b><span class="small">${esc(e&&e.message)}</span><span class="small">Take a screenshot of this and send it to Claude.</span><div><button class="btn sm" data-act="tab" data-t="check">Back to Checklist</button></div></div>`;
  }
}
window.addEventListener('error',e=>toast('Error: '+(e.message||'unknown')));

/* ---------- shared components ---------- */
function vGate(){return `<div class="card gate"><h2>Account not linked</h2><p class="muted" style="margin:0">Your login is not linked to a staff member. Ask your manager to check your login email under Setup → Staff.</p><button class="btn" data-act="logout">Sign out</button></div>`}
function vGateOld(){
  return `<div class="card gate"><h2>Sign in</h2><p class="muted" style="margin:0">Choose your name and enter your password.</p>
  <form data-act="login"><label class="fld"><span>Name</span><select id="gate-who"><option value="">${loaded?'Choose your name':'Loading names…'}</option>${sortByName('staff').map(s=>`<option value="${s.id}"${s.id===lsGet('last')?' selected':''}>${esc(staffLabel(s))}</option>`).join('')}<option value="__mgr">Manager / Admin</option></select></label>
  <label class="fld"><span>Password</span><input type="password" id="gate-pw" inputmode="numeric" autocomplete="current-password" placeholder="••••"></label>
  <button class="btn primary" type="submit">Sign in</button></form>
  <p class="muted small" style="margin:0">Staff use their own PIN. The admin password works for any name. Default for both is 1234.</p></div>`;
}
function acctCard(){return `<div class="card"><div class="row spread"><div><b>${esc(ui.me?nm('staff',ui.me):'Manager')}</b><div class="muted small">${ui.mgr?'Manager access':'Staff access'} · v${VERSION}</div></div>
  <div class="actions"><button class="btn sm" data-act="logout">Sign out</button><button class="btn sm" data-act="who">Close</button></div></div></div>`}
function weekNav(){
  const ds=weekDates(ui.ws), t=todayIso(), y=parse(ds[0]).getFullYear();
  return `<div class="card"><div class="weeknav">
    <button class="btn sm" data-act="wk" data-n="-1" aria-label="Previous week">‹</button>
    <div class="wl">Week ${isoWeek(ui.ws)} · ${fmt(ds[0]).slice(4)} – ${fmt(ds[4]).slice(4)} ${y}</div>
    <button class="btn sm" data-act="wk" data-n="1" aria-label="Next week">›</button>
    <button class="btn sm" data-act="wk0">This week</button><button class="btn sm primary" data-act="today">Today</button></div>
    <div class="days"><button class="day${ui.day==='all'?' on':''}" data-act="day" data-d="all"><span>Week</span><b>${isoWeek(ui.ws)}</b></button>
    ${ds.map(d=>`<button class="day${ui.day===d?' on':''}${d===t?' today':''}" data-act="day" data-d="${d}"><span>${DAYS[parse(d).getDay()]}</span><b>${parse(d).getDate()}</b></button>`).join('')}</div></div>`;
}
const selDates=()=>ui.day==='all'?weekDates(ui.ws):[ui.day];
function filtersCard(){

function clearBtn(){const d=focusDay();return clearPast()?`<button class="btn sm" disabled title="Past weeks can't be cleared">Clear ${fmt(d)}</button>`:`<button class="btn sm danger" data-act="clearopen">Clear ${fmt(d)}</button>`}
function clearBox(){if(!ui.clearOpen||clearPast())return '';const n=clearTargets().length;

const toMin=t=>{if(!t||t==='99')return null;const [h,m]=t.split(':').map(Number);return h*60+m};
function clashList(sid,date,s,e,exId){
  if(s==null)return[];if(e==null||e<=s)e=s+30;const out=[];
  const ov=(a,b)=>{if(a==null)return false;if(b==null||b<=a)b=a+30;return a<e&&b>s};
  S.resp.forEach(r=>{if(r.id===exId||!applies(r,date)||!staffFor(r).includes(sid))return;if(ov(toMin(oStart(r)),toMin(oEnd(r))))out.push(`"${r.text}" ${timeLabel(r)}`)});
  S.plans.forEach(p=>{if(p.id===exId||p.date!==date||(p.staffId!==sid&&p.staffId!=='*'))return;if(ov(toMin(oStart(p)),toMin(oEnd(p))))out.push(`plan "${p.text}" ${timeLabel(p)}`)});
  const br=(byId('staff',sid)||{}).branchId;S.breaks.forEach(x=>{if(x.branchId&&x.branchId!==br)return;if(ov(toMin(x.start),toMin(x.end)))out.push(`${x.name||'Break'} ${x.start||''}${x.end?'–'+x.end:''}`)});
  return out}
function checkClash(f,d,sids,dates,exId){
  const s=toMin(d.start),e=toMin(d.end);if(s==null)return false;
  const key=f+JSON.stringify([d.text,d.staffId,d.start,d.end,dates]);if(ui.clash&&ui.clash.key===key)return false;
  const hits=[];sids.forEach(sid=>dates.forEach(dt=>clashList(sid,dt,s,e,exId).forEach(x=>hits.push(`${nm('staff',sid)} · ${fmt(dt)}: ${x}`))));
  if(!hits.length)return false;
  ui.clash={f,key,hits};render();toast('Time clash found. Check the warning.');return true}
function clashBox(f){const c=ui.clash;if(!c||c.f!==f)return '';
  return `<div class="banner"><b>Time clash</b>${c.hits.slice(0,4).map(x=>`<span class="small">${esc(x)}</span>`).join('')}${c.hits.length>4?`<span class="small muted">and ${c.hits.length-4} more</span>`:''}<span class="small">Change the time, or tap Save anyway to keep both.</span></div>`}

function bcls(sid){const s=byId('staff',sid);if(!s||!s.branchId)return '';const i=sortByName('branches').findIndex(b=>b.id===s.branchId);return i<0?'':'bc'+(i%6)}

function vTime(){
  let h=weekNav()+(ui.mgr?`<div class="card"><div class="grid2"><label class="fld"><span>Staff</span><select data-filter="staff"><option value="">All staff</option>${sortByName('staff').filter(x=>!ui.f.branch||x.branchId===ui.f.branch).map(x=>`<option value="${x.id}"${x.id===ui.f.staff?' selected':''}>${esc(staffLabel(x))}</option>`).join('')}</select></label>
    <label class="fld"><span>Branch</span><select data-filter="branch">${opt('branches',ui.f.branch,'All branches')}</select></label></div></div>`:'')+filtersCard()+evPanel();

  if(ui.mgr&&!ui.f.staff) h+=`<div class="banner info"><span class="small">Showing everyone. Pick one staff member above for a clearer timetable. Tap a block to edit it.</span></div>`;
  const cols=ds.map(d=>{
    const ev=[];
    itemsFor([d]).forEach(i=>ev.push({id:i.r.id,ed:ui.mgr,k:'task',t:i.r.text,who:i.sid,done:i.st==='done',miss:i.st==='missed',s:toMin(oStart(i.r)),e:toMin(oEnd(i.r))}));
    plansFor([d]).forEach(p=>ev.push({id:p.id,ed:ui.mgr||p.staffId===ui.me||p.by===ui.me,k:'plan',t:p.text,who:p.staffId,done:p.done,s:toMin(oStart(p)),e:toMin(oEnd(p))}));
    breaksFor().forEach(b=>ev.push({id:b.id,ed:ui.mgr,k:'brk',t:b.name||'Break',who:'',s:toMin(b.start),e:toMin(b.end)}));
    const any=ev.filter(x=>x.s==null).concat(testsOnDate(d).map(t=>({k:'test',t:'Test: '+(t.title||'')})));
    let tim=ev.filter(x=>x.s!=null).map(x=>{let s=Math.max(F0,Math.min(F1-15,x.s)),e=x.e==null||x.e<=x.s?x.s+30:x.e;e=Math.max(s+15,Math.min(F1,e));return {...x,s,e}});
    tim.forEach(x=>x.clash=x.k!=='brk'&&tim.some(y=>y!==x&&y.s<x.e&&y.e>x.s&&(y.k==='brk'||y.who===x.who||y.who==='*'||x.who==='*')));
    tim.sort((a,b)=>a.s-b.s||b.e-a.e);
    let cl=[],cEnd=-1;const out=[];
    const flush=()=>{const lanes=[];cl.forEach(x=>{let i=lanes.findIndex(v=>v<=x.s);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=x.e;x.lane=i});cl.forEach(x=>x.n=lanes.length);out.push(...cl);cl=[]};
    tim.forEach(x=>{if(cl.length&&x.s>=cEnd){flush();cEnd=-1}cl.push(x);cEnd=Math.max(cEnd,x.e)});flush();
    return {d,any,out};
  });
  const all=cols.flatMap(c=>c.out);
  if(all.length){T0=Math.max(F0,Math.floor(Math.min(...all.map(x=>x.s))/60)*60);T1=Math.min(F1,Math.ceil(Math.max(...all.map(x=>x.e))/60)*60);if(T1-T0<360)T1=Math.min(F1,T0+360);if(T1-T0<360)T0=Math.max(F0,T1-360)}
  else{T0=480;T1=600}
  const H=(T1-T0)/15*PX, maxAny=Math.max(0,...cols.map(c=>c.any.length)), anyH=maxAny?maxAny*20+6:0;

    <div class="ttbody" style="height:${H}px;background-size:100% ${4*PX}px">${c.out.map(x=>`<div class="ev ev-${x.k}${x.done?' evdone':''}${x.miss?' evmiss':''}${x.clash?' clash':''}${x.ed?' evx':''}"${x.ed?` data-act="evedit" data-ek="${x.k}" data-eid="${x.id}" data-ed="${c.d}" data-es="${x.who||''}" role="button" tabindex="0"`:''} style="top:${(x.s-T0)/15*PX}px;height:${(x.e-x.s)/15*PX-2}px;left:calc(${x.lane/x.n*100}% + 2px);width:calc(${100/x.n}% - 4px)" title="${esc(x.t)} ${hm(x.s)}–${hm(x.e)}"><b>${hm(x.s)}</b> ${lbl(x)}</div>`).join('')}</div></div>`;
  });
  const clashes=cols.flatMap(c=>c.out.filter(x=>x.clash).map(x=>({...x,d:c.d})));
  h+=`<div class="legend"><span class="lg ev-task">Task</span><span class="lg ev-plan">Plan</span><span class="lg ev-brk">Break</span><span class="lg ev-test">Test</span><button class="lg clash lgbtn" data-act="clashlist">${ui.clashOpen?'Hide clashes':'Clashes'} (${clashes.length})</button></div>`;
  if(ui.clashOpen) h+=`<div class="card"><h3>Clashes</h3>${clashes.length?`<div class="list">${clashes.map(x=>`<div class="li"><div class="lt"><div>${esc(x.t)}</div><div class="muted small">${fmt(x.d)} · ${hm(x.s)}–${hm(x.e)}${x.who?' · '+esc(nm('staff',x.who)):''}</div></div><div class="acts">${x.ed?`<button class="btn sm" data-act="evedit" data-ek="${x.k}" data-eid="${x.id}" data-ed="${x.d}" data-es="${x.who||''}">Move or re-assign</button>`:'<span class="muted small">Ask your manager</span>'}</div></div>`).join('')}</div>`:'<div class="muted small">No clashes this week.</div>'}</div>`;

/* ---------- overview ---------- */
function stats(dates){
  const per={};
  liveStaff().forEach(s=>{if((!ui.f.branch||s.branchId===ui.f.branch)&&(ui.mgr||s.id===ui.me)&&(!ui.mgr||!ui.f.staff||s.id===ui.f.staff))per[s.id]={s,tot:0,done:0,missed:0,open:0,off:0,plans:0,pdone:0}});
  S.resp.forEach(r=>staffFor(r).forEach(sid=>{const p=per[sid];if(!p)return;dates.forEach(d=>{if(!applies(r,d)||(r.skip||[]).includes(d+'|'+sid))return;const st=status(r,d,sid);
    if(st==='off'){p.off++;return}p.tot++;if(st==='done')p.done++;else if(st==='missed')p.missed++;else p.open++})}));
  S.plans.forEach(pl=>{if(!dates.includes(pl.date))return;const tg=pl.staffId==='*'?Object.values(per):per[pl.staffId]?[per[pl.staffId]]:[];tg.forEach(p=>{p.plans++;if(pl.done)p.pdone++})});
  return Object.values(per).sort((a,b)=>staffLabel(a.s).localeCompare(staffLabel(b.s)));
}
function repTable(head,rows,total,numFrom=1){
  const tr=(cells,cls='')=>`<tr${cls?` class="${cls}"`:''}>${cells.map((c,i)=>`<td${i>=numFrom?' class="n"':''}>${c}</td>`).join('')}</tr>`;
  return `<div class="tablebox"><table class="rep"><thead><tr>${head.map((x,i)=>`<th${i>=numFrom?' class="n"':''}>${x}</th>`).join('')}</tr></thead><tbody>
    ${rows.map((r,i)=>tr(r,i===rows.length-1?'pre':'')).join('')}${total?tr(total,'tot'):''}</tbody></table></div>`;
}
const cellPct=(d,t)=>`${pct(d,t)}%<div class="bar"><i style="width:${pct(d,t)}%"></i></div>`;
function myProgress(dates,span){
  const kids=[...new Set([...S.resp.filter(r=>!r.archived&&staffFor(r).includes(ui.me)).map(r=>r.childId),...S.plans.filter(p=>p.staffId===ui.me||p.staffId==='*').map(p=>p.childId)].filter(Boolean))]
    .map(id=>byId('children',id)).filter(Boolean).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(ui.pgChild&&!kids.some(k=>k.id===ui.pgChild))ui.pgChild='';
  const ok=o=>!ui.pgChild||o.childId===ui.pgChild;
  const its=itemsFor(dates).filter(i=>i.st!=='off'&&ok(i.r)), pls=plansFor(dates).filter(ok);
  const tdone=its.filter(i=>i.st==='done'),miss=its.filter(i=>i.st==='missed'),open=its.filter(i=>i.st==='due'||i.st==='upcoming'),pd=pls.filter(p=>p.done),pn=pls.filter(p=>!p.done);
  const row=(text,date,o)=>`<div class="li"><div class="lt"><div>${esc(text)}</div><div class="muted small">${[fmt(date),timeLabel(o),o.childId&&nm('children',o.childId)].filter(Boolean).map(esc).join(' · ')}</div></div></div>`;
  const grp=(k,l,arr,f,bad)=>{const o=ui.openDays.has(k);return dayHead(k,l,bad&&arr.length?`<span class="bad">${arr.length}</span>`:String(arr.length),bad)+(o?(arr.length?`<div class="list">${arr.map(f).join('')}</div>`:'<div class="muted small" style="padding:4px 2px">None.</div>'):'')};
  let h=`<div class="card"><label class="fld"><span>Child</span><select data-uiset="pgChild"><option value="">All my children</option>${kids.map(c=>`<option value="${c.id}"${c.id===ui.pgChild?' selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>`;
  h+=progress();
  h+=`<div class="subhd">This ${span}${ui.pgChild?' · '+esc(nm('children',ui.pgChild)):''} · tap + to see the items</div>`;
  h+=grp('pg-done','Tasks done',tdone,i=>row(i.r.text,i.date,i.r));
  h+=grp('pg-miss','Missed',miss,i=>row(i.r.text,i.date,i.r),true);
  h+=grp('pg-open','Still open',open,i=>row(i.r.text,i.date,i.r));
  h+=grp('pg-pdone','Plans done',pd,p=>row(p.text,p.date,p));
  h+=grp('pg-popen','Plans not done yet',pn,p=>row(p.text,p.date,p));
  const T=its.length+pls.length,D=tdone.length+pd.length;
  h+=`<div class="card"><div class="row spread"><b>Complete</b><b class="tnum">${D} of ${T} · ${pct(D,T)}%</b></div></div>`;
  return h;
}
function vOver(){

    <div class="actions" style="align-self:flex-end"><button class="btn sm" data-act="report">Printable report</button><button class="btn sm primary" data-act="excel">Export to Excel</button></div></div></div>`;
  const st=stats(dates);
  if(!st.length) return h+`<div class="card empty">No staff in this branch yet.</div>`;

    :`<button class="btn sm primary" data-act="sign" data-s="${x.s.id}">Sign off ${span}</button>`;

function records({child,grade,since}){
  const recs=[];
  S.entries.forEach(e=>{const r=byId('resp',e.rid);if(!r||e.date<since)return;const sid=e.sid||r.staffId;
    if(!ui.mgr&&sid!==ui.me)return;

    if(!e.done&&!e.comment&&!(e.photos||[]).length)return;
    recs.push({date:e.date,kind:'Task',text:r.text,sid,done:!!e.done,comment:e.comment,photos:e.photos,o:r})});
  S.plans.forEach(p=>{if(p.date<since)return;if(!ui.mgr&&p.staffId!==ui.me&&p.staffId!=='*')return;
    if(child&&p.childId!==child)return; if(grade&&p.gradeId!==grade&&childGrade(p.childId)!==grade)return;
    recs.push({date:p.date,kind:'Plan',text:p.text,sid:p.staffId,done:!!p.done,photos:p.photos,o:p})});
  return recs.sort((a,b)=>b.date.localeCompare(a.date));
}
function covTable(recs,only){
  const rows=[];let P=0,T=0;

    const tops=S.topics.filter(t=>t.subjectId===s.id).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    const line=(label,tf)=>{const rs=recs.filter(r=>r.o.curriculumId===s.id&&tf(r)),pl=rs.filter(r=>r.kind==='Plan').length,tk=rs.filter(r=>r.kind==='Task'&&r.done).length,last=rs.map(r=>r.date).sort().pop();
      P+=pl;T+=tk;rows.push([esc(s.name),esc(label),pl,tk,last?fmt(last):'<span class="bad">Not yet</span>'])};

  });

async function save(filename,data){

/* ---------- photos ---------- */
async function compress(file){
  try{const img=await createImageBitmap(file);const sc=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82))}catch(e){return file}
}

async function shrinkPhoto(blob){
  try{const img=await createImageBitmap(blob);let max=1000,q=.72,out='';
    for(let i=0;i<3;i++){const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<450000)break;max=Math.round(max*.75);q-=.08}
    return out}catch(e){return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)})}
}
const MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',json:'application/json',html:'text/html',jpg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif'};

  if(n==='db')return fsdb;
  if(n==='downloads')return {save:async({filename,data})=>{const ext=(filename.split('.').pop()||'').toLowerCase();
    const blob=data instanceof Blob?data:new Blob([data],{type:MIME[ext]||'application/octet-stream'});const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);return {status:'saved'}}};
  if(n==='assets')return {upload:async blob=>{const url=await shrinkPhoto(blob);return {id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),url,sizeBytes:url.length,contentType:'image/jpeg'}}};
  return null}};
